#sourcing theme
source = ~/.config/hypr/themes/mocha.conf

## Monitors
monitor = DP-3 ,1920x1080@165, 0x0, 1
monitor = HDMI-A-1 ,1920x1080@60, -1920x0, 1


## Environment Variables
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QPA_PLATFORM, wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = NVD_BACKEND, direct
env = XCURSOR_THEME, Bibata-Modern-Ice
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24

general {
    gaps_in = 3
    gaps_out = 3

    border_size = 2

    col.active_border = $darkerMauve
    col.inactive_border = $surface1

}


decoration {
    # rounding
    rounding = 10

    # opacity
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1

    # Shadows disabled currently
    shadow {
        enabled = false
    }

    # Dimming
    dim_inactive = false
    dim_strength = 0.5

    # Blur disabled currently
    blur {
        enabled = false
        size = 5
    }
}


animations {
    enabled = true

    bezier = ease, 0, 0.9, 0.18, 1

    animation = workspaces, 0, 0, ease
    animation = windows, 1, 2, ease, slide
    animation = layers, 1, 2, default, default
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    middle_click_paste = false
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us, ara
    kb_options = grp:win_space_toggle

    follow_mouse = 2
    float_switch_override_focus = 0
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
}

### Startups

exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = hyprctl dispatch workspace 1 # to make focus on main monitor on boot
exec-once = waypaper --restore
exec-once = systemctl --user start hyprpolkitagent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once = waybar & hypridle

## Binds and Bind variables
$terminal = foot
# $terminal = alacritty
# $terminal = ghostty --gtk-single-instance=true
# $terminal = wezterm
$fileManager = thunar
$menu = $HOME/.config/rofi/launchers/launcher.sh
$sc_all = grim $HOME/Pictures/Screenshots/$(date +'%s_grim.png') && notify-send "Captured Screen"
$sc_area = grim -g "$(slurp -d)" - | wl-copy && notify-send "Captured Screen"
$clipboard = cliphist list | rofi -dmenu -p "" -display-columns 2 -theme ~/.config/rofi/launchers/style-1-emoji.rasi| cliphist decode | wl-copy
$mainMod = alt
$emoji = rofi -modi emoji -show emoji -theme ~/.config/rofi/launchers/style-1-emoji.rasi

# Master bind to disable all keybinds
bind = SUPER_SHIFT, P, submap, clean
submap = clean
bind = SUPER_SHIFT, P, submap, reset
submap = reset

#wayscriber
bind = , F12, exec, wayscriber --daemon-toggle

bind = $mainMod, return, exec, $terminal
bind = $mainMod, W, killactive,
bind = ALT_SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, fullscreenstate, 0 2
bind = $mainMod, V, togglefloating,
bind = $mainMod, space, exec, $menu
bind = SUPER_SHIFT, A, exec, $sc_all
bind = SUPER_SHIFT, S, exec, $sc_area
bind = SUPER, code:60, exec, $emoji
bind = SUPER , V, exec, $clipboard


# focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, Left, alterzorder, top
bind = $mainMod, Right, alterzorder, top
bind = $mainMod, Up, alterzorder, top
bind = $mainMod, Down, alterzorder, top

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, H, alterzorder, top
bind = $mainMod, L, alterzorder, top
bind = $mainMod, K, alterzorder, top
bind = $mainMod, J, alterzorder, top

# move window
bind = SUPER_SHIFT, left, movewindow,l
bind = SUPER_SHIFT, right, movewindow,r
bind = SUPER_SHIFT, up, movewindow,u
bind = SUPER_SHIFT, down, movewindow,d
bind = SUPER_SHIFT, H, movewindow,l
bind = SUPER_SHIFT, L, movewindow,r
bind = SUPER_SHIFT, K, movewindow,u
bind = SUPER_SHIFT, J, movewindow,d

# workspaces
workspace = 1, monitor:DP-3, persistent=true
workspace = 2, monitor:DP-3, persistent=true
workspace = 3, monitor:DP-3, persistent=true
workspace = 4, monitor:DP-3, persistent=true
workspace = 5, monitor:DP-3, persistent=true
workspace = 6, monitor:HDMI-A-1, persistent=true

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

#secret workspace
bind = SUPER SHIFT, Z, workspace, name:secret
bind = SHIFT ALT, Z, movetoworkspace, name:secret

# moving workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

## window rules ##


# thunar
# windowrulev2 = float, class:([tT]hunar)
# windowrulev2 = size 1300 850, class:([tT]hunar)
windowrule = match:class ([tT]hunar), float 1, size 1300 850

# thunar
# windowrulev2 = float, class:(waypaper)
# windowrulev2 = size 1600 900, class:(waypaper)
windowrule = match:class (waypaper), float 1, size 1600 900

# Kitty
# windowrulev2 = opacity 1 0.95,class:(kitty)
windowrule = match:class (kitty), opacity 1 0.95

# alacritty
# windowrulev2 = opacity 1 0.95,class:([Aa]lacritty)
windowrule = match:class ([Aa]lacritty), opacity 1 0.95

# foot
# windowrulev2 = opacity 1 0.95,class:(foot)
windowrule = match:class (foot), opacity 1 0.95

# Spotify
# windowrulev2 = float, class:(Spotify)
# windowrulev2 = workspace 6, class:(Spotify)
# windowrulev2 = size 1100 650, class:(Spotify)
windowrule = match:class ([sS]potify), float 1, workspace 4, size 1100 650

# Discord
# windowrulev2 = float, class:(discord)
# windowrulev2 = workspace 6, class:(discord)
# windowrulev2 = size 1280 720, class:(discord)
windowrule = match:class (discord), float 1, center 1, workspace 5, size 1280 720
bind =, F6, pass, class:^(discord)$
bind =, page_down, pass, class:^(discord)$

# pwvucontrol
# windowrulev2 = float, class:(com.saivert.pwvucontrol)
windowrule = match:class (com.saivert.pwvucontrol), float 1

# VLC
# windowrulev2 = float, class:(vlc)
windowrule = match:class (vlc),float 1

# Rofi Animation
layerrule = animation slide top, match:namespace rofi

# Open files
# windowrulev2 = float, title:^(Open File)
# windowrulev2 = center, title:^(Open File)
# windowrulev2 = size 1100 720, title:^(Open File)
windowrule = match:class (Open File), float 1, center 1, size 1100 720


# Open files
# windowrulev2 = float, class:^(org.gnome.Nautilus)
# windowrulev2 = center, class:^(org.gnome.Nautilus)
# windowrulev2 = size 1100 720, class:^(org.gnome.Nautilus)
windowrule = match:class (org.gnome.Nautilus), float 1, center 1, size 1100 720


# All files
# windowrulev2 = float, title:^(All Files)
# windowrulev2 = size 1100 720, title:^(All Files)
windowrule = match:title ^(All Files), float 1, size 1100 720

# File Roller
# windowrulev2 = float, class:(org.gnome.FileRoller)
# windowrulev2 = size 1100 720, class:(org.gnome.FileRoller)
windowrule = match:class (org.gnome.FileRoller), float 1, size 1100 720

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus true

# fix blur under chromium context menu
# windowrulev2=noblur,class:^()$,title:^()$
windowrule = match:class ^()$, match:title ^()$, no_blur true

# Smart gaps
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule = match:workspace w[tv1], match:float 0, border_size 0, rounding 0
windowrule = match:workspace f[1], match:float 0, border_size 0, rounding 0

# JETBRAINS SHIT
windowrule = center true, match:class jetbrains-.*, match:title splash, match:float true
windowrule = no_focus true, match:class jetbrains-.*, match:title splash, match:float true

windowrule = no_focus true, match:class jetbrains-.*, match:title win.*, match:float true

windowrule = no_blur true, match:class jetbrains-.*, match:float true
windowrule = no_initial_focus true, match:class jetbrains-.*, match:float true
windowrule = opacity 1 override 1 override 1, match:class jetbrains-.*, match:float true
